<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>Santa Cruz Consulta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{--f:#111317;--f2:#1a1e25;--b:#2c313a;--t:#eef0f2;--t2:#a7adb5;--t3:#7d838c;--v:#1F9D55;--a:#E0A100;--r:#D64545;--az:#2563EB;--vm:#C8102E}
*{box-sizing:border-box}html,body{margin:0;background:var(--f);color:var(--t);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--f);padding:12px 14px 10px;border-bottom:1px solid var(--b)}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:10px}.topo img{width:30px;height:30px;border-radius:7px}
.topo b{font-size:17px}.topo small{margin-left:auto;color:var(--t3);font-size:11px;text-align:right}
#q{width:100%;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid #3a404b;background:#0b0d10;color:#fff;outline:none}
#q:focus{border-color:var(--vm)}
main{padding:8px 14px 90px}
.item{padding:12px 4px;border-bottom:1px solid #222730;font-size:15px}.item b{font-size:16px}.item span{display:block;color:var(--t2);font-size:12.5px;margin-top:2px}
.vaz{color:var(--t3);font-size:14px;padding:18px 4px;line-height:1.45}
.nome{font-size:24px;font-weight:700;margin:10px 0 2px}.sub{color:var(--t2);font-size:13.5px;margin-top:3px}.sub b{color:#fff;font-size:15px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bl{background:var(--f2);border:1px solid var(--b);border-left:6px solid #444;border-radius:10px;padding:9px 11px}
.bl small{display:block;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--t3)}
.bl b{display:block;font-size:22px;margin:3px 0 2px}.bl span{display:block;font-size:12px;color:var(--t2);line-height:1.3}
.bl.c-az{border-left-color:var(--az)}.bl.c-v{border-left-color:var(--v)}.bl.c-a{border-left-color:var(--a)}.bl.c-r{border-left-color:var(--r)}
.whats{margin-top:12px;background:#0f2a1c;border:1px solid #1f5a3a;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.4}
.whats small{display:block;color:#7fc79b;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.bts{display:flex;gap:8px;margin-top:10px}.bts button{flex:1;padding:13px;border-radius:10px;border:1px solid #3a404b;background:#222831;color:#eee;font-size:15px}
.bts .ok{background:#1f7a44;border-color:#2a9a58;color:#fff;font-weight:700}
.entrar{margin:30px auto;display:block;padding:14px 20px;border-radius:10px;border:0;background:var(--vm);color:#fff;font-size:16px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f7a44;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.leg{color:var(--t3);font-size:11.5px;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="topo"><img src="icone-192.png" alt=""><b>Santa Cruz Consulta</b><small id="ver"></small></div>
  <input id="q" type="search" placeholder="nome do jogador (e o clube, se precisar)" autocomplete="off" disabled>
</header>
<main id="m"><div class="vaz">carregando…</div></main>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="app.js?v=1"></script>
</body>
</html>
