<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>Santa Cruz Consulta</title>
<script>/* celular abrindo como "site para computador" (ou dentro do WhatsApp): a página vem com ~980 px de largura e tudo
encolhe. Aqui o app amplia na proporção da tela de verdade. */
(function(){function aj(){var w=screen.width||0,i=window.innerWidth||0;document.documentElement.style.zoom=(w&&w<760&&i>w*1.25)?(i/w).toFixed(2):'';}aj();addEventListener('resize',aj);})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{--f:#111317;--f2:#1a1e25;--b:#2c313a;--t:#eef0f2;--t2:#a7adb5;--t3:#7d838c;--v:#1F9D55;--a:#E0A100;--r:#D64545;--az:#2563EB;--vm:#C8102E}
*{box-sizing:border-box}html,body{margin:0;background:var(--f);color:var(--t);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--f);padding:14px 16px 11px;border-bottom:1.1px solid var(--b)}
.topo{display:flex;align-items:center;gap:11px;margin-bottom:11px}.topo img{width:35px;height:35px;border-radius:8px}
.topo b{font-size:20px}.topo small{margin-left:auto;color:var(--t3);font-size:13px;text-align:right}
#q{width:100%;font-size:21px;padding:14px 16px;border-radius:11px;border:1.1px solid #3a404b;background:#0b0d10;color:#fff;outline:none}
#q:focus{border-color:var(--vm)}
main{padding:10px 16px 104px}
.item{padding:14px 5px;border-bottom:1.1px solid #222730;font-size:18px}.item b{font-size:18px}.item span{display:block;color:var(--t2);font-size:14px;margin-top:2.3px}
.vaz{color:var(--t3);font-size:16px;padding:21px 5px;line-height:1.45}
.nome{font-size:28px;font-weight:700;margin:11px 0 2.3px}.sub{color:var(--t2);font-size:16px;margin-top:3px}.sub b{color:#fff;font-size:18px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.bl{background:var(--f2);border:1.1px solid var(--b);border-left:7px solid #444;border-radius:11px;padding:10px 13px}
.bl small{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--t3)}
.bl b{display:block;font-size:26px;margin:3px 0 2.3px}.bl span{display:block;font-size:14px;color:var(--t2);line-height:1.3}
.bl.c-az{border-left-color:var(--az)}.bl.c-v{border-left-color:var(--v)}.bl.c-a{border-left-color:var(--a)}.bl.c-r{border-left-color:var(--r)}
.whats{margin-top:14px;background:#0f2a1c;border:1.1px solid #1f5a3a;border-radius:11px;padding:11px 14px;font-size:18px;line-height:1.4}
.whats small{display:block;color:#7fc79b;font-size:12px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
.bts{display:flex;gap:10px;margin-top:11px}.bts button{flex:1;padding:15px;border-radius:11px;border:1.1px solid #3a404b;background:#222831;color:#eee;font-size:18px}
.bts .ok{background:#1f7a44;border-color:#2a9a58;color:#fff;font-weight:700}
.entrar{margin:35px auto;display:block;padding:16px 23px;border-radius:11px;border:0;background:var(--vm);color:#fff;font-size:18px;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f7a44;color:#fff;padding:11px 18px;border-radius:23px;font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.leg{color:var(--t3);font-size:14px;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="topo"><img src="icone-192.png" alt=""><b>Santa Cruz Consulta</b><small id="ver"></small></div>
  <input id="q" type="search" placeholder="nome do jogador (e o clube, se precisar)" autocomplete="off" disabled>
</header>
<main id="m"><div class="vaz">carregando…</div></main>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
