<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>Consulta de Jogadores</title>
<script>/* celular abrindo como "site para computador" (ou dentro do WhatsApp): a página vem com ~980 px de largura e tudo
encolhe. Aqui o app amplia na proporção da tela de verdade. */
(function(){function aj(){var w=screen.width||0,i=window.innerWidth||0;document.documentElement.style.zoom=(w&&w<760&&i>w*1.25)?(i/w).toFixed(2):'';}aj();addEventListener('resize',aj);})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-cj-192.png">
<link rel="apple-touch-icon" href="icone-cj-192.png">
<style>
:root{--f:#111317;--f2:#1a1e25;--b:#2c313a;--t:#eef0f2;--t2:#a7adb5;--t3:#7d838c;--v:#1F9D55;--a:#E0A100;--r:#D64545;--az:#2563EB;--vm:#C8102E}
*{box-sizing:border-box}html,body{margin:0;background:var(--f);color:var(--t);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--f);padding:10px 12px 8px;border-bottom:1px solid var(--b)}
.topo{display:flex;align-items:center;gap:8px;margin-bottom:8px}.topo img{width:24px;height:24px;border-radius:6px}
.topo b{font-size:16px;white-space:nowrap}.topo small{margin-left:auto;color:var(--t3);font-size:10.5px;text-align:right;line-height:1.25}
#q{width:100%;font-size:17px;padding:9px 12px;border-radius:9px;border:1px solid #3a404b;background:#0b0d10;color:#fff;outline:none}
#q:focus{border-color:var(--vm)}
main{padding:6px 12px 20px}
.item{padding:10px 2px;border-bottom:1px solid #222730;font-size:15px}.item b{font-size:16px}.item span{display:block;color:var(--t2);font-size:12.5px;margin-top:2px}
.vaz{color:var(--t3);font-size:14px;padding:14px 2px;line-height:1.45}
.nome{font-size:21px;font-weight:700;margin:6px 0 1px;line-height:1.15}.sub{color:var(--t2);font-size:12.5px;margin-top:2px;line-height:1.35}.sub b{color:#fff;font-size:13.5px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.bl{background:var(--f2);border:1px solid var(--b);border-left:5px solid #444;border-radius:9px;padding:6px 9px 7px;min-height:0}
.bl.larga{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bl small{display:block;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--t3)}
.bl.larga small{display:inline}
.bl b{display:block;font-size:19px;margin:2px 0 1px;line-height:1.15}.bl.larga b{display:inline}
.bl span{display:block;font-size:11.5px;color:var(--t2);line-height:1.25}.bl.larga span{display:inline}
.bl.c-az{border-left-color:var(--az)}.bl.c-v{border-left-color:var(--v)}.bl.c-a{border-left-color:var(--a)}.bl.c-r{border-left-color:var(--r)}
.whats{margin-top:8px;background:#0f2a1c;border:1px solid #1f5a3a;border-radius:9px;padding:7px 10px;font-size:13.5px;line-height:1.35}
.whats small{display:block;color:#7fc79b;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.bts{display:flex;gap:6px;margin-top:8px}.bts button{flex:1;padding:10px;border-radius:9px;border:1px solid #3a404b;background:#222831;color:#eee;font-size:15px}
.bts .ok{background:#1f7a44;border-color:#2a9a58;color:#fff;font-weight:700;flex:1.6}
.entrar{margin:24px auto;display:block;padding:13px 20px;border-radius:10px;border:0;background:var(--vm);color:#fff;font-size:16px;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f7a44;color:#fff;padding:9px 15px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.leg{color:var(--t3);font-size:12px;margin-top:12px;line-height:1.55}
.bl.tem{cursor:pointer}.bl small i{font-style:normal;color:#9fb3c8;float:right}.bl.sel{outline:2px solid #5b8def}
.det{margin-top:7px;background:#161a20;border:1px solid var(--b);border-radius:9px;padding:8px 10px}
.dt{display:block;font-size:12.5px;margin-bottom:5px}.dtab{width:100%;border-collapse:collapse;font-size:12.5px}
.dtab th{font-size:9.5px;color:var(--t3);text-transform:uppercase;text-align:right;padding:2px 4px;font-weight:600}.dtab th:first-child{text-align:left}
.dtab td{padding:3px 4px;border-top:1px solid #242a33}.dtab td.n{text-align:right;white-space:nowrap}.dtab td.pq{font-size:11px;color:var(--t2)}
.dtab b.v{color:#4ade80}.dtab b.a{color:#facc15}.dtab b.r{color:#f87171}.dm{color:#8fb0ff;font-style:normal;font-size:10px}
.bola{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#666}.bola.v{background:#1F9D55}.bola.a{background:#E0A100}.bola.r{background:#D64545}
.dn{font-size:10.5px;color:var(--t3);margin-top:5px;line-height:1.35}
.pst{margin-top:8px;font-size:12.5px;color:var(--t2)}
.pedir{margin-top:8px;width:100%;padding:10px;border-radius:9px;border:1px solid #3a404b;background:#1a2330;color:#bcd6ff;font-size:14px}.pedir.forte{border-color:#2f5d9a;background:#14233a;color:#fff;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="topo"><img src="icone-cj-192.png" alt=""><b>Consulta de Jogadores</b><small id="ver"></small></div>
  <input id="q" type="search" placeholder="nome do jogador (e o clube, se precisar)" autocomplete="off" disabled>
</header>
<main id="m"><div class="vaz">carregando…</div></main>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
