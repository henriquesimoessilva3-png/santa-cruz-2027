<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>Santa Cruz Consulta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{--f:#111317;--f2:#1a1e25;--b:#2c313a;--t:#eef0f2;--t2:#a7adb5;--t3:#7d838c;--v:#1F9D55;--a:#E0A100;--r:#D64545;--az:#2563EB;--vm:#C8102E}
*{box-sizing:border-box}html,body{margin:0;background:var(--f);color:var(--t);font-family:Arial,Helvetica,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--f);padding:17px 20px 14px;border-bottom:1.4px solid var(--b)}
.topo{display:flex;align-items:center;gap:14px;margin-bottom:14px}.topo img{width:44px;height:44px;border-radius:10px}
.topo b{font-size:25px}.topo small{margin-left:auto;color:var(--t3);font-size:16px;text-align:right}
#q{width:100%;font-size:26px;padding:17px 20px;border-radius:14px;border:1.4px solid #3a404b;background:#0b0d10;color:#fff;outline:none}
#q:focus{border-color:var(--vm)}
main{padding:12px 20px 130px}
.item{padding:17px 6px;border-bottom:1.4px solid #222730;font-size:22px}.item b{font-size:23px}.item span{display:block;color:var(--t2);font-size:18px;margin-top:2.9px}
.vaz{color:var(--t3);font-size:20px;padding:26px 6px;line-height:1.45}
.nome{font-size:35px;font-weight:700;margin:14px 0 2.9px}.sub{color:var(--t2);font-size:20px;margin-top:4px}.sub b{color:#fff;font-size:22px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}
.bl{background:var(--f2);border:1.4px solid var(--b);border-left:9px solid #444;border-radius:14px;padding:13px 16px}
.bl small{display:block;font-size:15px;letter-spacing:.7px;text-transform:uppercase;color:var(--t3)}
.bl b{display:block;font-size:32px;margin:4px 0 2.9px}.bl span{display:block;font-size:17px;color:var(--t2);line-height:1.3}
.bl.c-az{border-left-color:var(--az)}.bl.c-v{border-left-color:var(--v)}.bl.c-a{border-left-color:var(--a)}.bl.c-r{border-left-color:var(--r)}
.whats{margin-top:17px;background:#0f2a1c;border:1.4px solid #1f5a3a;border-radius:14px;padding:14px 17px;font-size:22px;line-height:1.4}
.whats small{display:block;color:#7fc79b;font-size:15px;letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px}
.bts{display:flex;gap:12px;margin-top:14px}.bts button{flex:1;padding:19px;border-radius:14px;border:1.4px solid #3a404b;background:#222831;color:#eee;font-size:22px}
.bts .ok{background:#1f7a44;border-color:#2a9a58;color:#fff;font-weight:700}
.entrar{margin:44px auto;display:block;padding:20px 29px;border-radius:14px;border:0;background:var(--vm);color:#fff;font-size:23px;font-weight:700}
.toast{position:fixed;left:50%;bottom:35px;transform:translateX(-50%);background:#1f7a44;color:#fff;padding:14px 23px;border-radius:29px;font-size:20px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.leg{color:var(--t3);font-size:17px;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="topo"><img src="icone-192.png" alt=""><b>Santa Cruz Consulta</b><small id="ver"></small></div>
  <input id="q" type="search" placeholder="nome do jogador (e o clube, se precisar)" autocomplete="off" disabled>
</header>
<main id="m"><div class="vaz">carregando…</div></main>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="app.js?v=2"></script>
</body>
</html>
